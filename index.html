<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор миномёта</title>
<style>
  :root {
    --bg-1: #1b2735;
    --bg-2: #090a0f;
    --card-bg: rgba(22, 28, 38, 0.95);
    --card-border: #2c3644;
    --text: #e6edf3;
    --muted: #8b97a6;
    --field-bg: #0e131a;
    --field-border: #2c3644;
    --input-bg: #151b24;
    --input-border: #2c3644;
    --input-text: #e6edf3;
    --placeholder: #4a5563;
    --btn-bg: #1e2733;
    --btn-border: #2c3644;
    --btn-hover-bg: #26313f;
    --btn-hover-border: #3a4a5e;
    --result-bg: #0e131a;
    --result-border: #2c3644;
    --steps-border: #232c38;
    --steps-text: #7d8b9c;
    --shadow: 0 20px 50px rgba(0,0,0,0.6);
    --toggle-bg: #1e2733;
    --toggle-border: #2c3644;
    --toggle-hover: #26313f;
    --title-color: #e6edf3;
    --help-bg: #0e131a;
    --help-border: #2c3644;
    --help-accent: #4a9eff;
    --help-code-bg: #151b24;
    --help-code-text: #8fd3ff;
    --help-warn: #ffb84d;
    --hist-item-bg: #151b24;
    --hist-item-hover: #1c2530;
    --hist-item-border: #232c38;
    --azimuth-color: #4a9eff;
  }

  body.light {
    --bg-1: #e8edf3;
    --bg-2: #cfd8e3;
    --card-bg: #ffffff;
    --card-border: #d8e0ea;
    --text: #1b2735;
    --muted: #5a6878;
    --field-bg: #f4f7fb;
    --field-border: #d8e0ea;
    --input-bg: #ffffff;
    --input-border: #d8e0ea;
    --input-text: #1b2735;
    --placeholder: #9aa5b5;
    --btn-bg: #eef2f7;
    --btn-border: #d8e0ea;
    --btn-hover-bg: #e2e8f0;
    --btn-hover-border: #b8c2d0;
    --result-bg: #f4f7fb;
    --result-border: #d8e0ea;
    --steps-border: #e0e6ee;
    --steps-text: #5a6878;
    --shadow: 0 20px 40px rgba(30,50,80,0.12);
    --toggle-bg: #eef2f7;
    --toggle-border: #d8e0ea;
    --toggle-hover: #e2e8f0;
    --title-color: #1b2735;
    --help-bg: #f4f7fb;
    --help-border: #d8e0ea;
    --help-accent: #2b6fd6;
    --help-code-bg: #eaf1fb;
    --help-code-text: #1d4ed8;
    --help-warn: #b45309;
    --hist-item-bg: #f4f7fb;
    --hist-item-hover: #eaf0f8;
    --hist-item-border: #e0e6ee;
    --azimuth-color: #2b6fd6;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text);
    padding: 20px;
    transition: background 0.35s ease, color 0.35s ease;
  }

  .layout { position: relative; }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 22px 28px;
    box-shadow: var(--shadow);
    transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  h1 {
    flex: 1;
    margin: 0;
    font-size: 19px;
    text-align: center;
    letter-spacing: 0.3px;
    color: var(--title-color);
    transition: color 0.35s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .icon-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    border-radius: 50%;
    color: var(--text);
    transition: background 0.2s, border-color 0.2s, transform 0.15s, color 0.2s;
    user-select: none;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .icon-btn:hover { background: var(--toggle-hover); }
  .icon-btn:active { transform: scale(0.92); }

  .theme-toggle { font-size: 16px; }
  .help-btn { font-weight: 700; font-size: 14px; }
  .hist-btn { font-size: 15px; }
  .lang-btn { font-weight: 700; font-size: 10.5px; letter-spacing: 0.5px; }

  .help-btn:hover, .help-btn.active { color: var(--help-accent); border-color: var(--help-accent); }
  .hist-btn:hover, .hist-btn.active { color: var(--help-accent); border-color: var(--help-accent); }
  .lang-btn:hover { color: var(--help-accent); border-color: var(--help-accent); }

  .help-panel {
    position: absolute;
    top: 0;
    right: 100%;
    margin-right: 16px;
    width: 320px;
    opacity: 0;
    transform: translateX(24px);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.35s ease;
  }

  .layout.help-open .help-panel {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .help-inner {
    width: 100%;
    padding: 16px 18px 18px;
    background: var(--help-bg);
    border: 1px solid var(--help-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  .help-inner h3 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--help-accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .help-inner h3:not(:first-child) { margin-top: 12px; }
  .help-inner p { margin: 0 0 8px; color: var(--muted); }
  .help-inner ol { margin: 0; padding-left: 18px; color: var(--muted); }
  .help-inner ol li { margin-bottom: 4px; }
  .help-inner ol li b { color: var(--text); font-weight: 600; }

  .help-inner code {
    display: inline-block;
    padding: 1px 5px;
    background: var(--help-code-bg);
    color: var(--help-code-text);
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    letter-spacing: 0.2px;
    white-space: nowrap;
    vertical-align: baseline;
  }

  .help-inner .tip {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--help-code-bg);
    border-radius: 8px;
    border-left: 3px solid var(--help-accent);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .help-inner .tip + .tip { margin-top: 6px; }
  .help-inner .tip b { color: var(--text); }

  .help-inner .tip .tip-code {
    display: block;
    margin-top: 5px;
    padding: 4px 8px;
    background: rgba(74, 158, 255, 0.08);
    border-radius: 5px;
    font-family: 'Consolas', monospace;
    font-size: 11.5px;
    color: var(--help-code-text);
    letter-spacing: 0.2px;
    line-height: 1.4;
    word-break: break-all;
    white-space: normal;
  }

  body.light .help-inner .tip .tip-code {
    background: rgba(43, 111, 214, 0.08);
  }

  .help-inner .warn {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--help-code-bg);
    border-radius: 8px;
    border-left: 3px solid var(--help-warn);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .help-inner .warn b { color: var(--help-warn); }

  .history-panel {
    position: absolute;
    top: 0;
    left: 100%;
    margin-left: 16px;
    width: 340px;
    opacity: 0;
    transform: translateX(-24px);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.35s ease;
  }

  .layout.history-open .history-panel {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .hist-inner {
    width: 100%;
    padding: 18px 18px 16px;
    background: var(--help-bg);
    border: 1px solid var(--help-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    font-size: 13px;
    color: var(--text);
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .hist-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--help-accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .hist-clear {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--hist-item-border);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    font-family: inherit;
  }

  .hist-clear:hover { color: #ff6b6b; border-color: #ff6b6b; }
  body.light .hist-clear:hover { color: #dc2626; border-color: #dc2626; }

  .hist-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
    margin-right: -6px;
    padding-right: 6px;
  }

  .hist-list::-webkit-scrollbar { width: 6px; }
  .hist-list::-webkit-scrollbar-track { background: transparent; }
  .hist-list::-webkit-scrollbar-thumb { background: var(--hist-item-border); border-radius: 3px; }

  .hist-item {
    background: var(--hist-item-bg);
    border: 1px solid var(--hist-item-border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .hist-item:hover { background: var(--hist-item-hover); border-color: var(--help-accent); }
  .hist-item:active { transform: scale(0.99); }

  .hist-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .hist-meters {
    font-size: 20px;
    font-weight: 700;
    color: #4ade80;
    font-family: 'Consolas', monospace;
    line-height: 1.1;
  }

  body.light .hist-meters { color: #16a34a; }

  .hist-meters .unit { font-size: 13px; opacity: 0.75; margin-left: 2px; }
  .hist-meters .az { color: var(--azimuth-color); margin-left: 6px; font-size: 14px; }

  .hist-time {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Consolas', monospace;
    flex-shrink: 0;
  }

  .hist-coords {
    font-size: 11.5px;
    color: var(--muted);
    font-family: 'Consolas', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hist-coords .sep { opacity: 0.5; margin: 0 4px; }

  .hist-empty {
    text-align: center;
    padding: 24px 8px;
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
  }

  .field {
    margin-bottom: 12px;
    padding: 12px 14px 14px;
    border-radius: 12px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  .field.player { border-left: 3px solid #4ade80; }
  .field.enemy  { border-left: 3px solid #ff6b6b; }

  .field-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .player .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .enemy  .dot { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; }

  .field-title { font-size: 13px; font-weight: 600; letter-spacing: 0.4px; }
  .player .field-title { color: #16a34a; }
  .enemy  .field-title { color: #dc2626; }

  body:not(.light) .player .field-title { color: #4ade80; }
  body:not(.light) .enemy  .field-title { color: #ff6b6b; }

  .field-hint { font-size: 11px; color: var(--muted); margin-left: auto; }

  .field input {
    width: 100%;
    padding: 11px 13px;
    font-size: 15px;
    font-family: 'Consolas', monospace;
    color: var(--input-text);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.35s, color 0.35s;
    letter-spacing: 0.5px;
  }

  .field input:focus {
    border-color: #4a9eff;
    box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
  }

  .field input::placeholder { color: var(--placeholder); }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .btn {
    flex: 1;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, border-color 0.15s, color 0.35s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .btn:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
  .btn:active { transform: scale(0.97); }

  .btn .icon { font-size: 15px; line-height: 1; }

  .btn.primary {
    color: #fff;
    background: linear-gradient(135deg, #4a9eff, #2b6fd6);
    border: none;
  }

  .btn.primary:hover { box-shadow: 0 6px 20px rgba(74, 158, 255, 0.35); }
  .btn.primary .icon { font-size: 16px; }

  .result {
    margin-top: 20px;
    padding: 18px 14px 16px;
    border-radius: 12px;
    background: var(--result-bg);
    border: 1px solid var(--result-border);
    text-align: center;
    display: none;
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  .result.show { display: block; }

  .dual {
    display: flex;
    align-items: stretch;
    justify-content: center;
  }

  .dual-block {
    flex: 1;
    min-width: 0;
    padding: 0 6px;
  }

  .dual-divider {
    width: 1px;
    background: var(--steps-border);
    margin: 4px 0;
    flex-shrink: 0;
    transition: background 0.35s ease;
  }

  .result .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--muted);
    margin-bottom: 8px;
    user-select: none;
  }

  .result .value {
    font-size: 36px;
    font-weight: 700;
    color: #4ade80;
    font-family: 'Consolas', monospace;
    line-height: 1;
    white-space: nowrap;
  }

  body.light .result .value { color: #16a34a; }

  .result .value.azimuth { color: var(--azimuth-color); }

  .result .value .unit {
    font-size: 20px;
    opacity: 0.7;
    margin-left: 2px;
  }

  /* ° у азимута — верхний индекс */
  .result .value.azimuth .unit {
    display: inline-block;
    font-size: 24px;
    opacity: 0.85;
    margin-left: 1px;
    vertical-align: baseline;
    position: relative;
    top: -0.5em;
    line-height: 1;
  }

  .steps {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--steps-text);
    font-family: 'Consolas', monospace;
    text-align: left;
    line-height: 1.6;
    border-top: 1px solid var(--steps-border);
    padding-top: 12px;
    white-space: pre-line;
    transition: color 0.35s, border-color 0.35s;
    display: none;
  }

  .steps.show { display: block; }

  .error-box {
    text-align: left;
    padding: 4px 2px;
  }

  .error-box.error {
    color: #ff6b6b;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
    line-height: 1.5;
  }

  body.light .error-box.error { color: #dc2626; }

  .error-box.error .example {
    display: inline-block;
    margin-top: 4px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    color: #ffb3b3;
    font-weight: 500;
  }

  body.light .error-box.error .example { color: #b91c1c; }

  .error-box.warning {
    color: #ffb84d;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
    line-height: 1.5;
    text-align: center;
  }

  body.light .error-box.warning { color: #b45309; }

  .error-box.warning .sub {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 500;
    color: #b8a070;
  }

  body.light .error-box.warning .sub { color: #92400e; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #2b6fd6;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 1280px) {
    .help-panel,
    .history-panel {
      position: fixed;
      inset: 0;
      right: auto;
      left: auto;
      margin: 0;
      width: auto;
      max-width: none;
      opacity: 0;
      transform: none;
      pointer-events: none;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(6, 10, 16, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: opacity 0.22s ease;
    }

    body.light .help-panel,
    body.light .history-panel { background: rgba(40, 60, 90, 0.35); }

    .help-panel.open,
    .history-panel.open { opacity: 1; pointer-events: auto; }

    .help-inner,
    .hist-inner {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .hist-list { max-height: 60vh; }
    h1 { font-size: 17px; }
  }

  @media (max-width: 420px) {
    .result .value { font-size: 28px; }
    .result .value .unit { font-size: 16px; }
    .result .value.azimuth .unit { font-size: 18px; top: -0.5em; }
  }
</style>
</head>
<body>

<div class="layout" id="layout">

  <div class="card">
    <div class="card-head">
      <button class="icon-btn help-btn" id="helpToggle">?</button>
      <h1 id="mainTitle">🎯 Калькулятор миномёта</h1>
      <button class="icon-btn hist-btn" id="histToggle">🕘</button>
      <button class="icon-btn lang-btn" id="langToggle">EN</button>
      <button class="icon-btn theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="field player">
      <div class="field-head">
        <div class="dot"></div>
        <div class="field-title" id="fieldATitle">A — моя позиция (игрок)</div>
        <div class="field-hint" id="fieldAHint">откуда</div>
      </div>
      <input id="a" type="text" placeholder="x104.44, y63.52" autocomplete="off" spellcheck="false">
    </div>

    <div class="field enemy">
      <div class="field-head">
        <div class="dot"></div>
        <div class="field-title" id="fieldBTitle">B — позиция врага</div>
        <div class="field-hint" id="fieldBHint">куда</div>
      </div>
      <input id="b" type="text" placeholder="x100.35, y58.98" autocomplete="off" spellcheck="false">
    </div>

    <div class="btn-row">
      <button class="btn primary" id="calcBtn">
        <span class="icon">🎯</span> <span id="calcBtnText">Рассчитать</span>
      </button>
      <button class="btn" id="clearBtn">
        <span class="icon">🗑</span> <span id="clearBtnText">Очистить</span>
      </button>
    </div>

    <div class="result" id="result">
      <div class="dual" id="dual">
        <div class="dual-block">
          <div class="label" id="labelDistance">Дистанция</div>
          <div class="value" id="valueMeters">0<span class="unit">м</span></div>
        </div>
        <div class="dual-divider"></div>
        <div class="dual-block">
          <div class="label" id="labelAzimuth">Азимут</div>
          <div class="value azimuth" id="valueAzimuth">0<span class="unit">°</span></div>
        </div>
      </div>
      <div class="error-box" id="errorBox" style="display:none;"></div>
      <div class="steps" id="steps"></div>
    </div>
  </div>

  <aside class="help-panel" id="helpPanel">
    <div class="help-inner">
      <h3 id="helpFormatTitle"></h3>
      <p id="helpFormatText"></p>
      <h3 id="helpHowToTitle"></h3>
      <ol>
        <li id="helpStep1"></li>
        <li id="helpStep2"></li>
        <li id="helpStep3"></li>
      </ol>
      <div class="tip" id="helpTip1"></div>
      <div class="tip" id="helpTip2"></div>
      <div class="warn" id="helpWarn"></div>
    </div>
  </aside>

  <aside class="history-panel" id="historyPanel">
    <div class="hist-inner">
      <div class="hist-head">
        <div class="hist-title" id="histTitle">История</div>
        <button class="hist-clear" id="histClear">Очистить</button>
      </div>
      <div class="hist-list" id="histList">
        <div class="hist-empty">Пока пусто — посчитай что-нибудь</div>
      </div>
    </div>
  </aside>

</div>

<div class="toast" id="toast"></div>

<script>
const METERS_PER_UNIT = 100;
const EXAMPLE = 'x100.34, y59.44';
const HISTORY_LIMIT = 10;

const COMPASS = {
  ru: ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'],
  en: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
};

const T = {
  ru: {
    title: '🎯 Калькулятор миномёта',
    docTitle: 'Калькулятор миномёта',
    helpBtnTitle: 'Как пользоваться?',
    histBtnTitle: 'История расчётов',
    themeBtnDark: 'Включить тёмную тему',
    themeBtnLight: 'Включить светлую тему',
    langBtnTitle: 'Switch to English',
    langBtnLabel: 'EN',
    fieldATitle: 'A — моя позиция (игрок)',
    fieldAHint: 'откуда',
    fieldBTitle: 'B — позиция врага',
    fieldBHint: 'куда',
    calcBtn: 'Рассчитать',
    clearBtn: 'Очистить',
    labelDistance: 'Дистанция',
    labelAzimuth: 'Азимут',
    unitMeters: 'м',
    errNoA: '• Не введена позиция игрока',
    errNoB: '• Не введена позиция врага',
    errBadA: '• A — неверный формат, пример:',
    errBadB: '• B — неверный формат, пример:',
    warnSame: '⚠ A и B совпадают',
    warnSameSub: 'Это одна и та же точка — дистанция 0 м',
    histTitle: 'История',
    histClear: 'Очистить',
    histEmpty: 'Пока пусто — посчитай что-нибудь',
    toastBothPasted: 'Обе точки вставлены',
    toastRestored: 'Координаты восстановлены',
    toastHistCleared: 'История очищена',
    helpFormatTitle: 'Формат ввода',
    helpFormatText: 'Введи координаты в формате <code>x104.44, y63.52</code> — как показывается в игре.',
    helpHowToTitle: 'Как считать',
    helpStep1: '<b>Поле A</b> — координаты, где стоишь ты (твоя позиция).',
    helpStep2: '<b>Поле B</b> — координаты врага (куда стрелять).',
    helpStep3: 'Результат в <b>метрах</b> и <b>азимут</b> в градусах появятся сами.',
    helpTip1: '<b>Совет:</b> можно вставить сразу обе точки одной строкой в любое поле — калькулятор сам разобьёт их на A и B:<div class="tip-code">x104.44, y63.52 x100.35, y58.98</div>',
    helpTip2: '<b>Ctrl+A</b> — быстро выделить координаты, как только они появятся в игровом чате.',
    helpWarn: '⚠️ <b>Передвижная артиллерия:</b> расчёт не учитывает рельеф. Из-за разницы высот между тобой и целью возможны отклонения — корректируй после первого выстрела.',
  },
  en: {
    title: '🎯 Mortar Calculator',
    docTitle: 'Mortar Calculator',
    helpBtnTitle: 'How to use?',
    histBtnTitle: 'Calculation history',
    themeBtnDark: 'Switch to dark theme',
    themeBtnLight: 'Switch to light theme',
    langBtnTitle: 'Переключить на русский',
    langBtnLabel: 'RU',
    fieldATitle: 'A — my position (player)',
    fieldAHint: 'from',
    fieldBTitle: 'B — enemy position',
    fieldBHint: 'to',
    calcBtn: 'Calculate',
    clearBtn: 'Clear',
    labelDistance: 'Distance',
    labelAzimuth: 'Azimuth',
    unitMeters: 'm',
    errNoA: '• Player position not entered',
    errNoB: '• Enemy position not entered',
    errBadA: '• A — invalid format, example:',
    errBadB: '• B — invalid format, example:',
    warnSame: '⚠ A and B are the same',
    warnSameSub: 'Same point — distance 0 m',
    histTitle: 'History',
    histClear: 'Clear',
    histEmpty: 'Empty — calculate something',
    toastBothPasted: 'Both points pasted',
    toastRestored: 'Coordinates restored',
    toastHistCleared: 'History cleared',
    helpFormatTitle: 'Input format',
    helpFormatText: 'Enter coordinates in format <code>x104.44, y63.52</code> — as shown in the game.',
    helpHowToTitle: 'How to calculate',
    helpStep1: '<b>Field A</b> — coordinates of your position.',
    helpStep2: '<b>Field B</b> — enemy coordinates (target).',
    helpStep3: 'The result in <b>meters</b> and <b>azimuth</b> in degrees appears automatically.',
    helpTip1: '<b>Tip:</b> you can paste both points in one line into either field — the calculator will split them into A and B:<div class="tip-code">x104.44, y63.52 x100.35, y58.98</div>',
    helpTip2: '<b>Ctrl+A</b> — quickly select coordinates as soon as they appear in the game chat.',
    helpWarn: '⚠️ <b>Mobile artillery:</b> terrain is not taken into account. Elevation differences between you and the target can cause deviation — adjust after the first shot.',
  }
};

let LANG = 'ru';
function t(key) { return T[LANG][key] || key; }

const $ = (id) => document.getElementById(id);
const inputA = $('a');
const inputB = $('b');
const layout = $('layout');
const helpPanel = $('helpPanel');
const helpToggle = $('helpToggle');
const historyPanel = $('historyPanel');
const histToggle = $('histToggle');
const histList = $('histList');

function computeAzimuth(A, B) {
  const dx = B.x - A.x;
  const dy = B.y - A.y;
  let angle = Math.atan2(dx, dy) * 180 / Math.PI;
  if (angle < 0) angle += 360;
  return angle;
}

function compassDirection(azimuth) {
  const dirs = COMPASS[LANG];
  const idx = Math.round(azimuth / 45) % 8;
  return dirs[idx];
}

function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light');
    $('themeToggle').textContent = '☀️';
    $('themeToggle').title = t('themeBtnDark');
  } else {
    document.body.classList.remove('light');
    $('themeToggle').textContent = '🌙';
    $('themeToggle').title = t('themeBtnLight');
  }
}

function toggleTheme() {
  const isLight = document.body.classList.contains('light');
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('mortar-theme', next); } catch (e) {}
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('docTitle');

  $('mainTitle').textContent = t('title');
  helpToggle.title = t('helpBtnTitle');
  histToggle.title = t('histBtnTitle');
  $('langToggle').title = t('langBtnTitle');
  $('langToggle').textContent = t('langBtnLabel');

  $('fieldATitle').textContent = t('fieldATitle');
  $('fieldAHint').textContent = t('fieldAHint');
  $('fieldBTitle').textContent = t('fieldBTitle');
  $('fieldBHint').textContent = t('fieldBHint');

  $('calcBtnText').textContent = t('calcBtn');
  $('clearBtnText').textContent = t('clearBtn');

  $('labelDistance').textContent = t('labelDistance');
  $('labelAzimuth').textContent = t('labelAzimuth');

  $('histTitle').textContent = t('histTitle');
  $('histClear').textContent = t('histClear');

  $('helpFormatTitle').textContent = t('helpFormatTitle');
  $('helpFormatText').innerHTML = t('helpFormatText');
  $('helpHowToTitle').textContent = t('helpHowToTitle');
  $('helpStep1').innerHTML = t('helpStep1');
  $('helpStep2').innerHTML = t('helpStep2');
  $('helpStep3').innerHTML = t('helpStep3');
  $('helpTip1').innerHTML = t('helpTip1');
  $('helpTip2').innerHTML = t('helpTip2');
  $('helpWarn').innerHTML = t('helpWarn');

  applyTheme(document.body.classList.contains('light') ? 'light' : 'dark');

  calculate();
  renderHistory();
}

function toggleLang() {
  LANG = LANG === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem('mortar-lang', LANG); } catch (e) {}
  applyLang();
  showToast(LANG === 'ru' ? 'Язык: русский' : 'Language: English');
}

(function initLang() {
  let saved = 'ru';
  try { saved = localStorage.getItem('mortar-lang') || 'ru'; } catch (e) {}
  LANG = saved === 'en' ? 'en' : 'ru';
})();

function setHelp(open) {
  layout.classList.toggle('help-open', open);
  helpPanel.classList.toggle('open', open);
  helpToggle.classList.toggle('active', open);
  try { localStorage.setItem('mortar-help', open ? 'open' : 'closed'); } catch (e) {}
}

function setHistory(open) {
  layout.classList.toggle('history-open', open);
  historyPanel.classList.toggle('open', open);
  histToggle.classList.toggle('active', open);
  try { localStorage.setItem('mortar-history', open ? 'open' : 'closed'); } catch (e) {}
}

function toggleHelp(e) {
  if (e) e.stopPropagation();
  const open = !layout.classList.contains('help-open');
  if (open && window.matchMedia('(max-width: 1280px)').matches) setHistory(false);
  setHelp(open);
}

function toggleHistory(e) {
  if (e) e.stopPropagation();
  const open = !layout.classList.contains('history-open');
  if (open && window.matchMedia('(max-width: 1280px)').matches) setHelp(false);
  setHistory(open);
}

document.addEventListener('click', (e) => {
  const isNarrow = window.matchMedia('(max-width: 1280px)').matches;
  if (isNarrow) return;

  if (layout.classList.contains('help-open') &&
      !helpPanel.contains(e.target) &&
      !helpToggle.contains(e.target) &&
      !e.target.closest('.card')) {
    setHelp(false);
  }
  if (layout.classList.contains('history-open') &&
      !historyPanel.contains(e.target) &&
      !histToggle.contains(e.target) &&
      !e.target.closest('.card')) {
    setHistory(false);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { setHelp(false); setHistory(false); }
});

let stepsVisible = false;
(function initSteps() {
  let saved = '0';
  try { saved = localStorage.getItem('mortar-steps-visible') || '0'; } catch (e) {}
  stepsVisible = saved === '1';
  updateStepsVisibility();
})();

function updateStepsVisibility() {
  const stepsEl = $('steps');
  if (!stepsEl) return;
  if (stepsVisible) stepsEl.classList.add('show');
  else stepsEl.classList.remove('show');
}

function toggleSteps() {
  stepsVisible = !stepsVisible;
  updateStepsVisibility();
  try { localStorage.setItem('mortar-steps-visible', stepsVisible ? '1' : '0'); } catch (e) {}
}

$('labelDistance').addEventListener('click', toggleSteps);
$('labelAzimuth').addEventListener('click', toggleSteps);

function loadHistory() {
  try {
    const raw = localStorage.getItem('mortar-history-list');
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveHistory(list) {
  try { localStorage.setItem('mortar-history-list', JSON.stringify(list)); } catch (e) {}
}

let history = loadHistory();

function formatTime(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function renderHistory() {
  if (!history.length) {
    histList.innerHTML = `<div class="hist-empty">${t('histEmpty')}</div>`;
    return;
  }

  histList.innerHTML = history.map((item, idx) => {
    const az = (item.azimuth !== undefined)
      ? `<span class="az">· ${Math.round(item.azimuth)}°</span>`
      : '';
    return `
      <div class="hist-item" data-idx="${idx}">
        <div class="hist-row">
          <div class="hist-meters">${item.meters.toFixed(0)}<span class="unit">${t('unitMeters')}</span>${az}</div>
          <div class="hist-time">${formatTime(item.time)}</div>
        </div>
        <div class="hist-coords">
          x${item.ax}, y${item.ay}<span class="sep">→</span>x${item.bx}, y${item.by}
        </div>
      </div>
    `;
  }).join('');
}

function pushHistory(ax, ay, bx, by, meters, azimuth) {
  if (history.length) {
    const last = history[0];
    if (last.ax === ax && last.ay === ay && last.bx === bx && last.by === by) {
      last.meters = meters;
      last.azimuth = azimuth;
      last.time = Date.now();
      saveHistory(history);
      renderHistory();
      return;
    }
  }

  history.unshift({ ax, ay, bx, by, meters, azimuth, time: Date.now() });
  if (history.length > HISTORY_LIMIT) history = history.slice(0, HISTORY_LIMIT);

  saveHistory(history);
  renderHistory();
}

histList.addEventListener('click', (e) => {
  const el = e.target.closest('.hist-item');
  if (!el) return;
  const idx = parseInt(el.dataset.idx, 10);
  const item = history[idx];
  if (!item) return;

  inputA.value = `x${item.ax}, y${item.ay}`;
  inputB.value = `x${item.bx}, y${item.by}`;
  calculate();
  showToast(t('toastRestored'));
});

$('histClear').addEventListener('click', () => {
  history = [];
  saveHistory(history);
  renderHistory();
  showToast(t('toastHistCleared'));
});

function parseCoord(str) {
  if (!str) return null;
  const m = String(str).match(
    /x\s*(-?\d+(?:[.,]\d+)?)\s*[,;]?\s*y\s*(-?\d+(?:[.,]\d+)?)/i
  );
  if (!m) return null;
  return {
    x: parseFloat(m[1].replace(',', '.')),
    y: parseFloat(m[2].replace(',', '.'))
  };
}

function parseAllCoords(str) {
  if (!str) return [];
  const re = /x\s*(-?\d+(?:[.,]\d+)?)\s*[,;]?\s*y\s*(-?\d+(?:[.,]\d+)?)/gi;
  const out = [];
  let m;
  while ((m = re.exec(str)) !== null) {
    out.push({
      x: parseFloat(m[1].replace(',', '.')),
      y: parseFloat(m[2].replace(',', '.'))
    });
  }
  return out;
}

function showToast(msg) {
  const tEl = $('toast');
  tEl.textContent = msg;
  tEl.classList.add('show');
  clearTimeout(tEl._timer);
  tEl._timer = setTimeout(() => tEl.classList.remove('show'), 1600);
}

function showError(html) {
  $('dual').style.display = 'none';
  const eb = $('errorBox');
  eb.style.display = 'block';
  eb.className = 'error-box error';
  eb.innerHTML = html;
  $('steps').textContent = '';
  updateStepsVisibility();
  $('result').classList.add('show');
}

function showWarning(html) {
  $('dual').style.display = 'none';
  const eb = $('errorBox');
  eb.style.display = 'block';
  eb.className = 'error-box warning';
  eb.innerHTML = html;
  $('steps').textContent = '';
  updateStepsVisibility();
  $('result').classList.add('show');
}

function clearResult() {
  $('result').classList.remove('show');
  $('dual').style.display = 'flex';
  const eb = $('errorBox');
  eb.style.display = 'none';
  eb.innerHTML = '';
  eb.className = 'error-box';
  $('valueMeters').innerHTML = '';
  $('valueAzimuth').innerHTML = '';
  $('steps').textContent = '';
  updateStepsVisibility();
}

function errorLine(kind, raw, parsed) {
  if (!raw) return kind === 'A' ? t('errNoA') : t('errNoB');
  if (!parsed) {
    const prefix = kind === 'A' ? t('errBadA') : t('errBadB');
    return `${prefix} <span class="example">${EXAMPLE}</span>`;
  }
  return null;
}

function calculate() {
  const rawA = inputA.value.trim();
  const rawB = inputB.value.trim();
  const A = parseCoord(rawA);
  const B = parseCoord(rawB);

  if (!rawA && !rawB) { clearResult(); return; }

  const errA = errorLine('A', rawA, A);
  const errB = errorLine('B', rawB, B);

  if (errA || errB) {
    const lines = [];
    if (errA) lines.push(errA);
    if (errB) lines.push(errB);
    return showError(lines.join('<br>'));
  }

  if (A.x === B.x && A.y === B.y) {
    return showWarning(
      t('warnSame') + `<span class="sub">${t('warnSameSub')}</span>`
    );
  }

  const dx = A.x - B.x;
  const dy = A.y - B.y;
  const dx2 = dx * dx;
  const dy2 = dy * dy;
  const sum = dx2 + dy2;
  const distanceUnits = Math.sqrt(sum);
  const meters = distanceUnits * METERS_PER_UNIT;

  const azimuth = computeAzimuth(A, B);
  const compass = compassDirection(azimuth);
  const azimuthInt = Math.round(azimuth);

  $('dual').style.display = 'flex';
  const eb = $('errorBox');
  eb.style.display = 'none';
  eb.className = 'error-box';
  eb.innerHTML = '';

  $('valueMeters').innerHTML = `${meters.toFixed(0)}<span class="unit">${t('unitMeters')}</span>`;
  $('valueAzimuth').innerHTML = `${azimuthInt}<span class="unit">°</span>`;

  $('steps').textContent =
    `A = x${A.x}, y${A.y}\n` +
    `B = x${B.x}, y${B.y}\n\n` +
    `${t('labelDistance')}:\n` +
    `dx = ${A.x} − ${B.x} = ${dx.toFixed(2)}\n` +
    `dy = ${A.y} − ${B.y} = ${dy.toFixed(2)}\n` +
    `√(${dx.toFixed(2)}² + ${dy.toFixed(2)}²) = ${distanceUnits.toFixed(4)}\n` +
    `${distanceUnits.toFixed(4)} × ${METERS_PER_UNIT} = ${meters.toFixed(2)} ${t('unitMeters')}\n\n` +
    `${t('labelAzimuth')}:\n` +
    `atan2(${dx.toFixed(2)}, ${dy.toFixed(2)}) = ${azimuth.toFixed(4)}° · ${compass}`;

  updateStepsVisibility();

  $('result').classList.add('show');

  pushHistory(A.x, A.y, B.x, B.y, meters, azimuth);
}

let autoTimer = null;
function scheduleCalc() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(calculate, 300);
}

function handlePasteSplit(e) {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text) return;
  const coords = parseAllCoords(text);

  if (coords.length >= 2) {
    e.preventDefault();
    inputA.value = `x${coords[0].x}, y${coords[0].y}`;
    inputB.value = `x${coords[1].x}, y${coords[1].y}`;
    calculate();
    showToast(t('toastBothPasted'));
  }
}

function clearAll() {
  inputA.value = '';
  inputB.value = '';
  clearResult();
  inputA.focus();
}

$('themeToggle').addEventListener('click', toggleTheme);
$('langToggle').addEventListener('click', toggleLang);
helpToggle.addEventListener('click', toggleHelp);
histToggle.addEventListener('click', toggleHistory);

inputA.addEventListener('input', scheduleCalc);
inputB.addEventListener('input', scheduleCalc);
inputA.addEventListener('paste', handlePasteSplit);
inputB.addEventListener('paste', handlePasteSplit);

inputA.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
inputB.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });

$('calcBtn').addEventListener('click', calculate);
$('clearBtn').addEventListener('click', clearAll);

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); calculate(); }
});

(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('mortar-theme') || 'dark'; } catch (e) {}
  applyTheme(saved);
})();

(function initPanels() {
  let savedHelp = 'closed';
  let savedHist = 'closed';
  try { savedHelp = localStorage.getItem('mortar-help') || 'closed'; } catch (e) {}
  try { savedHist = localStorage.getItem('mortar-history') || 'closed'; } catch (e) {}

  if (window.matchMedia('(max-width: 1280px)').matches) {
    if (savedHelp === 'open') { setHelp(true); setHistory(false); }
    else if (savedHist === 'open') { setHistory(true); setHelp(false); }
  } else {
    if (savedHelp === 'open') setHelp(true);
    if (savedHist === 'open') setHistory(true);
  }
})();

applyLang();
</script>
